<!DOCTYPE html>
<html lang="en">
    <head>
        <title>search485</title>

        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
        <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">

            
    </head>
    <div class="feed"> 
        <body>
            <div class="ask485">
                <title>ask485?</title>
            </div>

            <!-- DO NOT CHANGE THIS (aside from where we say 'FIXME') -->
            <form action="/" method="GET" class="search_bar">
                <input type="text" name="q" value = "{{query}}">/>
                <div class="pagerank_weight">PageRank Weight</div>
                <input type="range" name="w" min = "0" max = "1" step = "0.01" value = "{{weight}}"/>
                <input type="submit" value="Search"/>
            </form>

            {% if results %}
                {% for result in results %}
                <div class="docs"> 
                    <div class="doc_url"> <a href="{{result.url}}"> {{result.url}} </a> </div>
                    <div class="doc_title"> {{result.title}} </div>
                    <div class="doc_summary"> {{result.summary}} </div>
                </div>
                {% endfor %}
            {% else %}
                <div class="no_results">No search results found!</div>
            {% endif %}

        </body>
    </div>

</html>
